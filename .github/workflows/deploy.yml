name: CCP Full Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) Configurar AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # 3) Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 4) Build frontend
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ secrets.VITE_COGNITO_REGION }}
        run: |
          cd frontend
          npm run build

      # 5) Deploy frontend a S3
      - name: Deploy Frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://frontend-tienda/ --delete

      # 6) Empaquetar backend y subirlo al bucket temporal
      - name: Package Backend
        run: |
          tar -czf backend.tar.gz -C backend .

      - name: Upload Backend Artifact
        run: |
          aws s3 cp backend.tar.gz s3://backend-artifacts-brayan/backend.tar.gz

      # 7) Deploy backend usando SSM
      - name: Deploy Backend via SSM
        run: |
          aws ssm send-command \
            --targets "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend" \
            --parameters 'commands=[
              "aws s3 cp s3://backend-artifacts-brayan/backend.tar.gz /tmp/backend.tar.gz",
              "mkdir -p /var/www/backend",
              "rm -rf /var/www/backend/*",
              "tar -xzf /tmp/backend.tar.gz -C /var/www/backend",
              "cd /var/www/backend",
              "npm install",
              "pm2 restart backend || pm2 start index.js --name backend",
              "pm2 save"
            ]' \
            --region us-east-2

      # 8) Invalidar Cache CloudFront
      - name: CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
            --paths "/*"
